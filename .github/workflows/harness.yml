name: Harness

on:
  push:
    branches: [main]
  pull_request:
    # A label (api-change, breaking) changes what the public surface gate allows.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  harness:
    uses: Pollora/harness/.github/workflows/php-package.yml@v0.1.36
    with:
      # The whole mutation pass (the msi floor of the ratchet, run on main and every night) lasts about 50 minutes on the
      # runner (4,278 mutants), which the default limit of 30 minutes cancels. 90 leaves a margin; the same pass on
      # Pollora/media took 77 minutes for a 90 minute limit.
      quality-timeout-minutes: 90
    permissions:
      contents: read
