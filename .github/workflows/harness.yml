name: Harness

on:
  push:
    branches: [main]
  pull_request:
    # A label (api-change, breaking) changes what the public surface gate allows.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  harness:
    uses: Pollora/harness/.github/workflows/php-package.yml@v0.1.40
    with:
      # The whole mutation pass (the msi floor of the ratchet, run on main and every night) lasted 75 minutes on the runner with
      # a 90 minute limit; after the OAuth registration fixes it no longer finishes in 90 (both runs on main were cancelled at
      # that limit). 150 leaves room for the suite to grow.
      quality-timeout-minutes: 150
    permissions:
      contents: read
